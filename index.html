<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Jornal Casa Naim: notícias dos projetos que transformam vidas em Salto/SP.">
<title>Jornal Casa Naim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: folhas A4 brancas de jornal sobre uma mesa clara; uma folha por vez (folhear) ou todas em sequência (ler tudo / PDF). */
:root{
  --amarelo:#F8B038; --laranja:#E88000; --laranja-txt:#C26A00; --numero:#D27400; --pessego:#FDEBC6;
  --tinta:#2E2B28; --tinta-2:#5E5850; --rotulo:#6B665F; --rotulo-l:#A85A00;
  --linha:#DCD8D2; --foto:#ECEAE6; --papel:#FFFFFF; --mesa:#F2F0EC;
  --serif:"DM Serif Display", Georgia, "Times New Roman", serif;
  --sans:"Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{background:var(--mesa);color:var(--tinta);margin:0}
body{font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--papel)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}

/* ===== Barra de navegação (só na tela) ===== */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--papel);
  border-bottom:1px solid var(--linha);margin:0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.nav-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:7px 8px;font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--rotulo);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--tinta)}
.tab[aria-current="true"]{color:var(--tinta);border-bottom-color:var(--amarelo)}
.modo{flex:none;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);
  padding:7px 12px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.modo[aria-pressed="true"]{background:var(--amarelo);border-color:var(--amarelo)}

/* ===== Folha ===== */
.folhas{display:flex;flex-direction:column;align-items:center;gap:32px}
.folha{width:100%;max-width:880px;background:var(--papel);border:1px solid var(--linha);
  position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:1123px}
body:not(.tudo) .folha:not(.ativa){display:none}
.miolo{padding:36px 56px 32px;flex:1;display:flex;flex-direction:column;gap:24px;position:relative;z-index:1}
.telhado{position:absolute;right:-50px;top:128px;width:300px;height:170px;background:var(--pessego);
  clip-path:polygon(0 100%,50% 0,100% 100%,82% 100%,50% 30%,18% 100%);z-index:0}

/* Rótulos e títulos */
.rotulo{font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--rotulo)}
.rotulo.l{color:var(--rotulo-l)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance;color:var(--tinta)}
h1 em,h2 em,h3 em{color:var(--laranja-txt)}
.ph{color:var(--tinta-2);background:var(--pessego);padding:0 .15em}
p{margin:0}

/* Cabeçalho interno */
.cab{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--linha)}
.cab img{height:46px;width:auto}
.cab .info{text-align:right;font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--rotulo);line-height:1.7}
.cab .info b{color:var(--tinta);font-weight:900}

/* ===== Capa ===== */
.faixa-ed{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:10.5px;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;color:var(--rotulo);padding-bottom:10px;border-bottom:1px solid var(--linha)}
.mast{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:6px 2px}
.mast img{height:64px;width:auto}
.mast h1{font-size:clamp(46px,9vw,92px);line-height:.95;letter-spacing:-.01em}
.mast .lema{font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--tinta-2)}
.regua{border:0;border-top:3px solid var(--tinta);border-bottom:1px solid var(--tinta);height:6px;margin:0}

.capa-grid{display:grid;grid-template-columns:2fr 1fr;gap:28px}
.capa-grid>*{min-width:0}
.manchete{display:flex;flex-direction:column;gap:12px}
.manchete h2{font-size:clamp(30px,4.6vw,46px);line-height:1.05}
.linha-fina{font-size:16px;color:var(--tinta-2);line-height:1.5}
.editorial{border-left:1px solid var(--linha);padding-left:24px;display:flex;flex-direction:column;gap:12px}
.editorial h3{font-size:24px;line-height:1.15}
.editorial p{font-size:14px;color:var(--tinta-2)}
.assina{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta)}

.nesta{display:flex;flex-direction:column;gap:14px}
.nesta-tit{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--tinta);padding-bottom:8px}
.nesta-tit h3{font-size:26px}
.chamadas{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.chamada{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:16px 18px 18px;
  border-left:1px solid var(--linha);border-bottom:1px solid var(--linha);min-width:0}
.chamada:nth-child(3n+1){border-left:0;padding-left:0}
.chamada:focus-visible{outline:2px solid var(--laranja);outline-offset:-2px}
.chamada h4{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.15;margin:0;color:var(--tinta)}
.chamada p{font-size:13px;color:var(--tinta-2);line-height:1.5}
.chamada .ir{margin-top:auto;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--laranja-txt)}
.chamada:hover h4{color:var(--laranja-txt)}

/* Foto */
.foto{position:relative;background:var(--foto);aspect-ratio:16/10;max-width:100%;
  clip-path:polygon(0 12%,50% 0,100% 12%,100% 100%,0 100%);display:grid;place-items:center}
.foto .vazio{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--rotulo);text-align:center;padding:0 16px}
.foto .etiqueta{position:absolute;left:0;bottom:0;background:var(--amarelo);color:var(--tinta);
  font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px}
.legenda{font-size:12px;color:var(--rotulo);border-bottom:1px solid var(--linha);padding-bottom:8px}

/* ===== Página de projeto ===== */
.editoria{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.selo{background:var(--amarelo);color:var(--tinta);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;padding:7px 12px}
.editoria span{font-size:13px;font-weight:600;color:var(--tinta-2)}
.materia-tit{display:flex;flex-direction:column;gap:10px;max-width:640px}
.materia-tit h2{font-size:clamp(32px,5vw,50px);line-height:1.03}
.byline{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rotulo)}
.byline b{color:var(--tinta);font-weight:800}
.corpo-grid{display:grid;grid-template-columns:1fr 230px;gap:32px}
.corpo-grid>*{min-width:0}
.texto{display:flex;flex-direction:column;gap:14px}
.colunas{column-count:2;column-gap:28px;column-rule:1px solid var(--linha);font-size:14.5px;color:var(--tinta)}
.colunas p{margin-bottom:12px;break-inside:avoid-column}
.colunas p:first-child::first-letter{font-family:var(--serif);float:left;font-size:58px;line-height:.85;padding:4px 8px 0 0;color:var(--laranja-txt)}
.intertitulo{font-family:var(--serif);font-size:20px;color:var(--tinta);margin:4px 0 8px;break-after:avoid}

.lateral{display:flex;flex-direction:column;gap:22px;border-left:1px solid var(--linha);padding-left:24px}
.numeros{display:flex;flex-direction:column}
.num{display:flex;flex-direction:column;gap:2px;padding-block:12px;border-bottom:1px solid var(--linha)}
.num:first-of-type{padding-top:8px}
.num b{font-size:34px;font-weight:900;line-height:1;color:var(--numero);font-variant-numeric:tabular-nums}
.num>span{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rotulo)}
.citacao{display:flex;flex-direction:column;gap:10px}
.citacao blockquote{margin:0;font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.25;color:var(--tinta)}
.citacao blockquote::before{content:"“";display:block;font-size:56px;line-height:.6;color:var(--laranja);margin-bottom:6px}
.citacao cite{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-2)}
.ajuda{background:var(--amarelo);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.ajuda b{font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
.ajuda p{font-size:13px;line-height:1.5}

/* ===== Contracapa ===== */
.faca h2{font-size:clamp(34px,5.4vw,54px);line-height:1.02}
.formas{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--tinta)}
.forma{padding:20px 22px 22px 0;border-bottom:1px solid var(--linha);display:flex;flex-direction:column;gap:8px;min-width:0}
.forma:nth-child(2n){padding-left:22px;padding-right:0;border-left:1px solid var(--linha)}
.forma .n{font-size:30px;font-weight:900;line-height:1;color:var(--numero)}
.forma h3{font-size:24px}
.forma p{font-size:14px;color:var(--tinta-2)}
.chamada-loc{background:var(--amarelo);padding:18px 22px;text-align:center;display:flex;flex-direction:column;gap:4px}
.chamada-loc h3{font-size:26px}
.chamada-loc p{font-size:13px;font-weight:600}
.expediente{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;border-top:1px solid var(--linha);padding-top:18px}
.expediente>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.expediente p{font-size:13px;color:var(--tinta);overflow-wrap:anywhere}
.expediente a{color:var(--tinta);text-decoration:none;border-bottom:1px solid var(--amarelo)}

/* Rodapé curvo */
.rodape{position:relative;height:96px;flex:none}
.rodape svg{position:absolute;inset:0;width:100%;height:100%}
.rodape .txt{position:absolute;left:56px;right:56px;bottom:22px;display:flex;justify-content:center;text-align:center;
  font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta)}

/* Navegação inferior */
.passos{display:flex;justify-content:space-between;gap:12px;max-width:880px;width:100%;margin:20px auto 0}
.passo{border:0;background:none;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta);padding:10px 0}
.passo:disabled{color:var(--linha);cursor:default}
body.tudo .passos{display:none}

/* ===== Celular ===== */
@media (max-width:720px){
  :is(#folhas,.leitura) .folha{min-height:0}
  :is(#folhas,.leitura) .miolo{padding:24px 20px 24px}
  :is(#folhas,.leitura) .capa-grid,:is(#folhas,.leitura) .corpo-grid{grid-template-columns:1fr}
  :is(#folhas,.leitura) .editorial,:is(#folhas,.leitura) .lateral{border-left:0;padding-left:0;border-top:1px solid var(--linha);padding-top:18px}
  :is(#folhas,.leitura) .chamadas{grid-template-columns:1fr}
  :is(#folhas,.leitura) .chamada,:is(#folhas,.leitura) .chamada:nth-child(3n+1){border-left:0;padding-left:0;padding-right:0}
  :is(#folhas,.leitura) .colunas{column-count:1}
  :is(#folhas,.leitura) .formas{grid-template-columns:1fr}
  :is(#folhas,.leitura) .forma,:is(#folhas,.leitura) .forma:nth-child(2n){padding:18px 0;border-left:0}
  :is(#folhas,.leitura) .expediente{grid-template-columns:1fr}
  :is(#folhas,.leitura) .telhado{width:180px;height:100px;right:-40px;top:96px}
  :is(#folhas,.leitura) .rodape{height:72px}
  :is(#folhas,.leitura) .rodape .txt{left:20px;right:20px;bottom:14px;font-size:9.5px}
  :is(#folhas,.leitura) .cab img{height:36px}
  /* Tela cheia no celular: sem menu, página de ponta a ponta */
  .nav,.passos,.dica-leitura{display:none}
  body{padding-left:0;padding-right:0;padding-block:0;background:var(--papel)}
  html{background:var(--papel)}
  .folhas{gap:0}
  :is(#folhas,.leitura) .folha{border:0;min-height:100vh;min-height:100svh}
  :is(#folhas,.leitura) .miolo{padding-top:calc(20px + env(safe-area-inset-top, 0px));padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
  :is(#folhas,.leitura) .rodape{height:calc(72px + env(safe-area-inset-bottom, 0px))}
  :is(#folhas,.leitura) .rodape .txt{bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
  #pilula{display:block}
  body.tudo #pilula{display:none}
}
.pilula{display:none;position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));
  background:var(--tinta);color:var(--papel);opacity:.86;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  padding:7px 14px;border-radius:999px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums;transition:opacity .4s}
.pilula.some{opacity:0}
.so-estreito{display:none}
.seta-dica,.aviso-arraste{display:none}
.pg-rolagem{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--papel)}
.pg-rolagem .folha{display:flex;width:100%;max-width:none}
body.retrato.revista .livro-wrap{position:fixed;inset:0;padding:0!important;gap:0;min-height:0;justify-content:flex-start}
body.retrato.revista .livro-ctrl,body.retrato.revista .dica,body.retrato .flutua,body.retrato #l-ler{display:none!important}
body.retrato.revista{overflow:hidden}
body.retrato.revista .seta-dica{display:grid;place-items:center;position:fixed;z-index:8;top:50%;width:38px;height:38px;margin-top:-19px;border-radius:50%;
  background:var(--tinta);color:var(--papel);opacity:.0;pointer-events:none;font-size:26px;line-height:1;font-weight:700;transition:opacity .3s}
.seta-dica span{transform:translateY(-2px)}
.seta-dica.dir{right:calc(8px + env(safe-area-inset-right, 0px))}
.seta-dica.esq{left:calc(8px + env(safe-area-inset-left, 0px))}
body.retrato.revista .seta-dica.on{animation:pisca 1.4s ease-in-out infinite}
body.retrato.revista .seta-dica.dir.on{animation-name:piscaDir}
body.retrato.revista .seta-dica.esq.on{animation-name:piscaEsq}
@keyframes piscaDir{0%,100%{opacity:.18;transform:translateX(0)}50%{opacity:.75;transform:translateX(-6px)}}
@keyframes piscaEsq{0%,100%{opacity:.18;transform:translateX(0)}50%{opacity:.75;transform:translateX(6px)}}
body.retrato.revista .aviso-arraste{display:block;position:fixed;z-index:8;left:50%;bottom:calc(22px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);
  background:var(--tinta);color:var(--papel);opacity:.88;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:8px 14px;border-radius:999px;
  white-space:nowrap;pointer-events:none;transition:opacity .5s}
.aviso-arraste.some{opacity:0!important}
@media (prefers-reduced-motion:reduce){body.retrato.revista .seta-dica.on{animation:none;opacity:.5}}
body.revista:not(.largo) .so-estreito{display:inline-block}
.flutua{display:none;position:fixed;z-index:7;right:calc(14px + env(safe-area-inset-right, 0px));bottom:calc(18px + env(safe-area-inset-bottom, 0px));
  background:var(--amarelo);border-color:var(--amarelo);padding:10px 16px;font-size:12px}
@media (max-width:720px){
  body.revista{background:var(--mesa)}
  html:has(body.revista){background:var(--mesa)}
  body.revista .livro-wrap{min-height:100vh;min-height:100svh;justify-content:center;padding-block:calc(10px + env(safe-area-inset-top, 0px)) calc(10px + env(safe-area-inset-bottom, 0px));gap:12px}
  body.revista #pilula{display:none}
  body:not(.revista).tem-livro .flutua{display:inline-block}
  .livro-ctrl{gap:14px}
}
/* Sombra da folha virando (visível também no celular, onde a página não tem borda) */
.folha-virando{box-shadow:1px 0 0 var(--linha),18px 0 40px rgba(46,43,40,.28)}
.folha-virando::after{background:linear-gradient(90deg,rgba(46,43,40,.02) 0%,rgba(46,43,40,.10) 55%,rgba(46,43,40,.38) 100%)}
.folha.volta{box-shadow:1px 0 0 var(--linha),18px 0 40px rgba(46,43,40,.28)}
.folha.volta::after,.folha.revela::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:linear-gradient(90deg,rgba(46,43,40,.30),rgba(46,43,40,.06));animation:clareia .65s ease-out forwards}
@keyframes clareia{from{opacity:1}to{opacity:0}}
@media print{.pilula{display:none!important}}

/* ===== Página fixa A4 (revista e PDF) ===== */
.fixa{width:794px;max-width:none;height:1123px;min-height:0;border:0}
.fixa .mast h1{font-size:52px}
.fixa .materia-tit h2{font-size:50px}
.fixa .faca h2{font-size:54px}
.fixa .telhado{top:150px}
.fixa.capa .miolo{gap:14px;padding-top:26px}
.fixa.capa .mast{gap:6px}
.fixa.capa .mast img{height:40px}
.fixa.capa .nesta-tit h3{font-size:22px}
.fixa.capa .nesta-tit .rotulo{display:none}
.fixa.capa .manchete h2{font-size:32px}
.fixa.capa .foto{aspect-ratio:5/2}
.fixa.capa .linha-fina{font-size:14px}
.fixa.capa .chamada{padding-block:10px 12px;gap:5px}
.fixa.capa .chamada h4{font-size:18px}
.fixa.capa .chamada p{font-size:12px;line-height:1.4}

/* ===== Modo revista (computador) ===== */
.livro-wrap{display:none}
body.revista .folhas,body.revista .passos{display:none}
body.revista .livro-wrap{width:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:14px}
#livro{margin:0 auto}
.pg{background:var(--papel);overflow:hidden;position:absolute;width:0;height:0}
.stf__item.pg{width:auto;height:auto}
.escala{width:794px;height:1123px;transform:scale(var(--k,1));transform-origin:0 0}
body.revista .chamada *{pointer-events:none}
.livro-ctrl{position:relative;z-index:3;display:flex;align-items:center;gap:20px}
.seta{border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);width:40px;height:40px;font-size:16px;font-weight:800;display:grid;place-items:center}
.seta:disabled{border-color:var(--linha);color:var(--linha);cursor:default}
.contador{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--tinta);font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
.dica{position:relative;z-index:3;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rotulo)}
.so-revista,.so-largo{display:none}
body.revista .so-revista{display:inline-block}
body.largo .so-largo{display:inline-block}
body.revista #modo{display:none}

/* ===== Impressão / PDF ===== */
@page{size:794px 1123px;margin:0}
@media print{
  html,body{background:var(--papel);padding:0;margin:0}
  .nav,.passos,.livro-wrap,body::before{display:none}
  .folhas{display:block;gap:0;overflow:visible}
  .folha,body:not(.tudo) .folha:not(.ativa){display:flex;break-after:page;animation:none}
  .folha:last-child{break-after:auto}
  body.revista .folhas{display:block}
}

/* Virar página no celular */
.folhas{overflow-x:clip;position:relative;z-index:1;perspective:1600px;perspective-origin:50% 50vh}
.folha.ativa{cursor:pointer}
body.tudo .folha{cursor:auto}
.folha .chamada,.folha a{cursor:pointer}
.folha-virando{position:absolute;top:0;left:0;right:0;margin:0 auto;z-index:4;pointer-events:none;
  transform-origin:left center;backface-visibility:hidden;will-change:transform}
.folha-virando::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(46,43,40,0),rgba(46,43,40,.18));opacity:0;animation:sombra .6s ease-in forwards}
.folha-baixo{position:absolute;top:0;left:0;right:0;margin:0 auto;z-index:0;pointer-events:none}
.folha.volta{position:relative;z-index:4;transform-origin:left center;animation:volta .6s cubic-bezier(.3,.6,.25,1)}
.folha-virando.sai{animation:sai .6s cubic-bezier(.45,.05,.55,.95) forwards}
@keyframes sai{from{transform:rotateY(0)}to{transform:rotateY(-100deg)}}
@keyframes volta{from{transform:rotateY(-100deg)}to{transform:rotateY(0)}}
@keyframes sombra{to{opacity:1}}
.dica-leitura{max-width:880px;width:100%;margin:6px auto 0;text-align:center;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rotulo)}
body.tudo .dica-leitura,body.revista .dica-leitura{display:none}
@media print{.dica-leitura,.folha-virando,.folha-baixo{display:none}}
</style>

const PROJETOS = [

const ed = `Edição nº ${EDICAO.numero} · ${EDICAO.mes} de ${EDICAO.ano}`;
const pags = [{id:'capa', aba:'Capa'}, ...PROJETOS.map(p => ({id:p.id, aba:p.aba || p.nome.replace('Projeto ','')})), {id:'faca-parte', aba:'Faça parte'}];
const pg = id => String(pags.findIndex(p => p.id === id) + 1).padStart(2,'0');
const ph = s => s.replace(/\[([^\]]+)\]/g, '<span class="ph">[$1]</span>');

const rodape = dir => `
  <div class="rodape" aria-hidden="true">
    <svg viewBox="0 0 794 96" preserveAspectRatio="none"><path d="M0 40 Q397 -4 794 40 L794 96 L0 96 Z" fill="#F8B038"/><path d="M0 28 Q397 -16 794 28" fill="none" stroke="#E88000" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="txt"><span>${dir}</span></div>
  </div>`;

const cab = id => `
  <header class="cab">
    <img src="${LOGO}" alt="Casa Naim · Salto/SP">
    <div class="info"><b>Jornal Casa Naim</b><br>${ph(ed)} · Pág. ${pg(id)}</div>
  </header>`;

const foto = (txt, etiqueta) => `
  <div class="foto"><span class="vazio">${ph(txt)}</span>${etiqueta ? `<span class="etiqueta">${etiqueta}</span>` : ''}</div>`;

function capa(){
  return `<article class="folha capa" id="f-capa"><div class="miolo">
    <div class="faixa-ed"><span>${ph(ed)}</span><span>Salto/SP</span><span>Distribuição gratuita</span></div>
    <div class="mast">
      <img src="${LOGO}" alt="Casa Naim · Salto/SP">

      <div class="lema">Notícias de quem transforma vidas</div>
    </div>

    <div class="capa-grid">
      <div class="manchete">
        <span class="rotulo l">Manchete</span>
        <h2>${ph(CAPA.manchete)}</h2>
        <p class="linha-fina">${ph(CAPA.linhaFina)}</p>
        ${foto(CAPA.foto)}
        <p class="legenda">${ph(CAPA.legenda)}</p>
      </div>
      <aside class="editorial">
        <span class="rotulo">Editorial</span>
        <h3>${ph(CAPA.editorial.titulo)}</h3>

      <div class="chamadas">

          <button class="chamada" data-ir="${p.id}">

            <p>${ph(p.resumo)}</p>
            <span class="ir">Pág. ${pg(p.id)} →</span>
          </button>`).join('')}
      </div>
    </section>
  </div>${rodape(CAPA.frase)}</article>`;
}

function projeto(p){
  const corpo = p.paragrafos.map(x => typeof x === 'string' ? `<p>${ph(x)}</p>` : `<h3 class="intertitulo">${ph(x.intertitulo)}</h3>`).join('');
  return `<article class="folha" id="f-${p.id}"><div class="telhado" aria-hidden="true"></div><div class="miolo">
    ${cab(p.id)}
    <div class="editoria"><span class="selo">${p.nome}</span><span>${p.tema}</span></div>
    <div class="materia-tit">
      <h2>${ph(p.titulo)}</h2>
      <p class="linha-fina">${ph(p.linhaFina)}</p>
      <span class="byline">Por <b>${ph(p.autor)}</b> · ${ph(p.data)}</span>
    </div>
    <div class="corpo-grid">
      <div class="texto">
        ${foto(p.foto, p.nome)}
        <p class="legenda">${ph(p.legenda)}</p>
        <div class="colunas">${corpo}</div>
      </div>
      <aside class="lateral">
        <div class="numeros"><span class="rotulo l">Em números</span>
          ${p.numeros.map(([n,l]) => `<div class="num"><b>${ph(n)}</b><span>${ph(l)}</span></div>`).join('')}
        </div>
        <div class="citacao"><blockquote>${ph(p.citacao.texto)}</blockquote><cite>${ph(p.citacao.autor)}</cite></div>
        <div class="ajuda"><b>Como ajudar</b><p>${ph(p.ajuda)}</p></div>
      </aside>
    </div>
  </div>${rodape(p.frase)}</article>`;
}

      <div><span class="rotulo">WhatsApp</span>
        <p><a href="https://wa.me/5511972160780" target="_blank" rel="noopener">(11) 9 7216-0780</a></p>
        <p><a href="https://wa.me/5511945463759" target="_blank" rel="noopener">(11) 9 4546-3759</a></p>
        <p>Telefone (11) 4021-2267</p></div>
      <div><span class="rotulo">Endereço</span>
        <p><a href="https://www.google.com/maps/search/?api=1&query=R.+Rubi,+120,+Jd.+Sontag,+Salto,+SP" target="_blank" rel="noopener">R. Rubi, 120 · Jd. Sontag<br>Salto/SP · CEP 13.322-153</a></p></div>
      <div><span class="rotulo">Redes</span>
        <p><a href="https://instagram.com/casanaim" target="_blank" rel="noopener">@casanaim</a></p>
        <p><a href="https://casanaim.com.br" target="_blank" rel="noopener">casanaim.com.br</a></p>

    </div>
    <p class="byline">Expediente · Jornal Casa Naim · ${ph(ed)} · Textos: <b>[nomes]</b> · Fotos: <b>[nomes]</b></p>
  </div>${rodape(CONTRACAPA.frase)}</article>`;
}

document.getElementById('folhas').innerHTML = capa() + PROJETOS.map(projeto).join('') + contracapa();
document.getElementById('tabs').innerHTML = pags.map(p => `<button class="tab" role="tab" data-ir="${p.id}">${p.aba}</button>`).join('');

let atual = 0;
let tPilula;
function mostraPilula(txt){
  const p = document.getElementById('pilula'); if (!p) return;
  p.textContent = txt; p.classList.remove('some');
  clearTimeout(tPilula); tPilula = setTimeout(() => p.classList.add('some'), 1800);
}
const N = pags.length, dois = n => String(n).padStart(2,'0');
const $ = id => document.getElementById(id);
let livro = $('livro');
let pf = null;
const ehRevista = () => document.body.classList.contains('revista');
const ehTudo = () => document.body.classList.contains('tudo');
const spread = j => Math.floor((j + 1) / 2);

function marcaAbas(i){
  document.querySelectorAll('.tab').forEach((t,k) => { t.setAttribute('aria-current', k === i); if (k === i) t.scrollIntoView({block:'nearest', inline:'nearest'}); });
}
function contadorLivro(c){
  if (modoLivro === 'retrato'){
    $('l-cont').textContent = (c === 0 ? 'Capa' : c >= N - 1 ? 'Contracapa' : `Pág. ${dois(c+1)}`) + ` · ${dois(N)}`;
    $('l-ant').disabled = c === 0; $('l-prox').disabled = c >= N - 1; return;
  }
  const s = spread(c);
  const txt = c === 0 ? 'Capa' : c >= N - 1 ? 'Contracapa' : (s * 2 < N - 1 ? `Págs. ${dois(s*2)}–${dois(s*2+1)}` : `Pág. ${dois(s*2)}`);
  $('l-cont').textContent = txt + ` · ${dois(N)}`;
  $('l-ant').disabled = c === 0; $('l-prox').disabled = spread(c) === spread(N - 1);
}

function mostra(id){
  const i = Math.max(0, pags.findIndex(p => p.id === id));
  const antes = atual; atual = i;
  marcaAbas(i);
  if (ehRevista() && pf){
    const c = pf.getCurrentPageIndex();
    if (modoLivro === 'retrato' ? c !== i : spread(c) !== spread(i)) pf.flip(i);
    return;
  }
  const velha = $('f-' + pags[antes].id), nova = $('f-' + pags[i].id);
  const anima = !ehTudo() && i !== antes && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let copia = null;
  if (anima){
    document.querySelectorAll('.folha-virando,.folha-baixo').forEach(e => e.remove());
    copia = velha.cloneNode(true); copia.removeAttribute('id');
    copia.classList.add(i > antes ? 'folha-virando' : 'folha-baixo');
  }
  document.querySelectorAll('#folhas > .folha').forEach((f,k) => { f.classList.toggle('ativa', k === i); f.classList.remove('volta','revela'); });
  if (anima){
    window.scrollTo({top:0});
    $('folhas').appendChild(copia);
    if (i > antes){ void copia.offsetWidth; copia.classList.add('sai'); nova.classList.add('revela'); }
    else { void nova.offsetWidth; nova.classList.add('volta'); }
    setTimeout(() => { copia.remove(); nova.classList.remove('volta','revela'); }, 700);
  }
  $('ant').disabled = i === 0; $('prox').disabled = i === N - 1;
  $('cont').textContent = `${dois(i+1)} / ${dois(N)}`;
  if (i !== antes) mostraPilula(`${dois(i+1)} / ${dois(N)}`);
  if (ehTudo()) nova.scrollIntoView({behavior:'smooth', block:'start'});
  else if (i !== antes && !anima) window.scrollTo({top:0});
}
function vai(id){ if (location.hash !== '#' + id) location.hash = id; else mostra(id); }
const passo = d => ehRevista() && pf ? (d > 0 ? pf.flipNext() : pf.flipPrev()) : vai(pags[Math.min(N-1, Math.max(0, atual + d))].id);

window.addEventListener('hashchange', () => mostra(location.hash.slice(1)));
document.addEventListener('click', e => { const b = e.target.closest('[data-ir]'); if (b) vai(b.dataset.ir); });
$('ant').onclick = () => passo(-1); $('prox').onclick = () => passo(1);
$('l-ant').onclick = () => passo(-1); $('l-prox').onclick = () => passo(1);
document.addEventListener('keydown', e => {
  if (ehTudo() || e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') passo(1);
  if (e.key === 'ArrowLeft') passo(-1);
});

/* Tocar na lateral da página para virar */
$('folhas').addEventListener('click', e => {
  if (ehTudo() || e.target.closest('a,button,[data-ir]')) return;
  if (String(getSelection && getSelection()).length) return;
  const f = e.target.closest('.folha.ativa'); if (!f) return;
  const r = f.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  if (x > 0.5) passo(1); else passo(-1);
});

/* Primeiro toque no celular: ocupa a tela inteira (onde o navegador permite) */
let pediuTela = false;
document.addEventListener('touchend', () => {
  if (pediuTela || !matchMedia('(max-width:720px)').matches) return;
  pediuTela = true;
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen({navigationUI:'hide'}).catch(() => {});
}, {passive:true});

/* Arrastar o dedo para virar (celular) */
let x0 = null, y0 = 0;
$('folhas').addEventListener('touchstart', e => { if (ehTudo()) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
$('folhas').addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) passo(dx < 0 ? 1 : -1);
}, {passive:true});

/* Ler tudo */
const modo = $('modo');
modo.onclick = () => {
  const on = document.body.classList.toggle('tudo');
  modo.setAttribute('aria-pressed', on);
  modo.textContent = on ? 'Folhear' : 'Ler tudo';
  mostra(pags[atual].id);
};

/* Modo revista: duas páginas no computador, uma página no celular */
const temLivro = () => !!(window.St && St.PageFlip);
const ehDupla = () => innerWidth >= 960 && innerHeight >= 560;
let modoLivro = null;
function tamLivro(){
  const dupla = ehDupla();
  if (!dupla){ livro.style.width = innerWidth + 'px'; livro.style.height = innerHeight + 'px'; return; }
  const nav = document.querySelector('.nav');
  const navH = getComputedStyle(nav).display === 'none' ? 0 : nav.offsetHeight;
  const alto = innerHeight - navH - (dupla ? 130 : 110);
  let pw = Math.max(200, Math.min(1123, alto)) * 794 / 1123;
  pw = Math.min(pw, dupla ? (innerWidth - 48) / 2 : innerWidth - 16);
  livro.style.width = Math.floor(dupla ? pw * 2 : pw) + 'px';
  livro.style.height = Math.floor(pw * 1123 / 794) + 'px';
}
function escala(){
  const pg = livro.querySelector('.pg');
  const w = pg && pg.getBoundingClientRect().width;
  if (w) livro.style.setProperty('--k', w / 794);
}
function montaLivro(){
  modoLivro = ehDupla() ? 'dupla' : 'retrato';
  $('l-dica').textContent = modoLivro === 'dupla' ? 'Clique no canto da página ou arraste para virar' : 'Toque ou arraste o canto da página para virar';
  document.body.classList.toggle('retrato', modoLivro === 'retrato');
  const folhas = [...document.querySelectorAll('#folhas > .folha')];
  if (modoLivro === 'retrato'){
    livro.innerHTML = folhas.map(f => `<div class="pg"><div class="pg-rolagem leitura">${f.outerHTML.replace(/ id="f-[^"]*"/, '')}</div></div>`).join('');
    livro.querySelectorAll('.folha').forEach(f => { f.classList.add('ativa'); f.classList.remove('volta','revela'); });
  } else {
    livro.innerHTML = folhas.map((f,i) =>
      `<div class="pg"${i === 0 || i === N - 1 ? ' data-density="hard"' : ''}><div class="escala">${f.outerHTML.replace(/ id="f-[^"]*"/, '')}</div></div>`).join('');
    livro.querySelectorAll('.folha').forEach(f => { f.classList.add('fixa','ativa'); f.classList.remove('volta','revela'); });
  }
  tamLivro();
  const W = parseFloat(livro.style.width), H = parseFloat(livro.style.height);
  const pw = modoLivro === 'retrato' ? W : W / 2;
  const retr = modoLivro === 'retrato';
  pf = new St.PageFlip(livro, { width: retr ? W : 794, height: retr ? H : 1123, size:'stretch', minWidth: modoLivro === 'retrato' ? Math.ceil(pw) : 150, maxWidth: Math.floor(pw),
    minHeight:150, maxHeight: retr ? H : 1123, showCover:true, usePortrait: retr, maxShadowOpacity:.4, flippingTime:800,
    mobileScrollSupport: retr, useMouseEvents: !retr, startPage:atual });
  pf.loadFromHTML(livro.querySelectorAll('.pg'));
  livro.style.width = W + 'px'; livro.style.height = H + 'px'; livro.style.minWidth = '0'; livro.style.maxWidth = 'none';
  pf.update && pf.update();
  pf.on('flip', e => {
    atual = e.data; marcaAbas(e.data); contadorLivro(e.data); setas(e.data);
    if (++virou >= 1) $('aviso-arraste').classList.add('some');
    const id = pags[e.data].id; if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  });
  requestAnimationFrame(escala);
  contadorLivro(pf.getCurrentPageIndex());
  setas(pf.getCurrentPageIndex());
}
let virou = 0;
/* Arrastar o dedo para os lados vira a página no celular, mesmo devagar */
let ta = null;
document.querySelector('.livro-wrap').addEventListener('touchstart', e => {
  if (modoLivro !== 'retrato' || !pf) return;
  const t = e.touches[0]; ta = {x:t.clientX, y:t.clientY, pag:pf.getCurrentPageIndex()};
}, {passive:true, capture:true});
document.querySelector('.livro-wrap').addEventListener('touchend', e => {
  if (!ta || !pf) return;
  const t = e.changedTouches[0], dx = t.clientX - ta.x, dy = t.clientY - ta.y, pag = ta.pag; ta = null;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
  setTimeout(() => {
    if (pf.getState && pf.getState() !== 'read') return;
    dx < 0 ? pf.flipNext('bottom') : pf.flipPrev('bottom');
  }, 60);
}, {passive:true, capture:true});
function setas(c){
  $('seta-dir').classList.toggle('on', c < N - 1);
  $('seta-esq').classList.toggle('on', c > 0);
}
function refazLivro(){
  try { pf && pf.destroy(); } catch(e){}
  pf = null;
  const novo = document.createElement('div'); novo.id = 'livro';
  const velho = document.getElementById('livro');
  if (velho) velho.replaceWith(novo); else document.querySelector('.livro-wrap').prepend(novo);
  livro = novo;
  montaLivro();
}
function revista(on){
  document.body.classList.toggle('revista', on);
  if (!on) document.body.classList.remove('retrato');
  $('troca').textContent = on ? 'Modo leitura' : 'Modo revista';
  if (on){
    if (ehTudo()) modo.click();
    if (!pf) montaLivro();
    else if (modoLivro !== (ehDupla() ? 'dupla' : 'retrato')) refazLivro();
    else refazLivro();
  } else { window.scrollTo({top:0}); mostra(pags[atual].id); }
}
$('troca').onclick = () => revista(!ehRevista());
$('l-ler').onclick = () => revista(false);
$('volta-livro').onclick = () => revista(true);
$('cheia').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
};
document.addEventListener('fullscreenchange', () => { $('cheia').textContent = document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia'; });
let tamAnt = [innerWidth, innerHeight];
function ajusta(){
  document.body.classList.toggle('largo', ehDupla());
  if (!ehRevista() || !pf) return;
  const mudou = Math.abs(innerWidth - tamAnt[0]) > 2 || Math.abs(innerHeight - tamAnt[1]) > 80;
  if (modoLivro === 'retrato' && !ehDupla() && !mudou) return;
  tamAnt = [innerWidth, innerHeight];
  if (modoLivro !== (ehDupla() ? 'dupla' : 'retrato')) refazLivro();
  else refazLivro();
}
let tResize; window.addEventListener('resize', () => { clearTimeout(tResize); tResize = setTimeout(ajusta, 150); });

atual = Math.max(0, pags.findIndex(p => p.id === location.hash.slice(1)));
document.body.classList.toggle('largo', ehDupla());
document.body.classList.toggle('tem-livro', temLivro());
mostra(pags[atual].id);
if (temLivro()) revista(true);
tPilula = setTimeout(() => $('pilula').classList.add('some'), 3500);
</script>
